project:
  type: website
  output-dir: _site
  resources:
    - robots.txt
    - _headers

lang: de

website:
  title: "Klinik · Prototyp Patientenpfad"
  search: false

  navbar:
    title: "Klinik · Prototyp Patientenpfad"
    collapse-below: lg
    right:
      - text: "Das Wichtigste in Kürze"
        href: eilig.qmd
      - text: "Kontakt & Anmeldung"
        href: stationaer.html#kontaktzone

  page-navigation: true
  back-to-top-navigation: false

  page-footer:
    left: "Struktur-Prototyp — keine geprüfte medizinische Information"

format:
  html:
    theme: [default, pfad-custom.scss]
    toc: true
    toc-title: "Auf dieser Seite"
    toc-depth: 2
    grid:
      body-width: 760px
    link-external-newwindow: true
    include-in-header:
      text: |
        <meta name="robots" content="noindex, nofollow">
    include-after-body:
      text: |
        <script>
        function fb(btn, msg){
          var s = btn.parentElement.querySelector('.fb-danke');
          if (s) { s.textContent = msg; }
          btn.parentElement.querySelectorAll('button').forEach(function(b){ b.disabled = true; });
        }
        </script>

execute:
  freeze: auto
